<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="Menlo, Consolas, monospace" font-size="13">
  <title>Schematic: the Console tab of Chrome or Edge developer tools after the sign-in</title>
  <rect width="900" height="260" fill="#ffffff" stroke="#c8ccd0"/>
  <rect width="900" height="34" fill="#f1f3f4"/>
  <text x="16" y="22" fill="#5f6368">Elements</text>
  <rect x="96" y="0" width="80" height="34" fill="#ffffff"/>
  <rect x="96" y="31" width="80" height="3" fill="#1a73e8"/>
  <text x="108" y="22" fill="#1a73e8" font-weight="bold">Console</text>
  <text x="196" y="22" fill="#5f6368">Sources</text>
  <text x="276" y="22" fill="#5f6368">Network</text>
  <rect x="0" y="34" width="900" height="30" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="16" y="54" fill="#5f6368">Filter</text>
  <rect x="0" y="64" width="900" height="70" fill="#fdecea" stroke="#f5c2c0"/>
  <circle cx="22" cy="82" r="7" fill="#d93025"/>
  <text x="19" y="86" fill="#ffffff" font-size="11" font-weight="bold">x</text>
  <text x="38" y="86" fill="#a50e0e">Failed to launch 'mymap://oauth2redirect/fr?code=<tspan font-weight="bold" fill="#000000" style="text-decoration:underline">AbCdEf123-YOUR_CODE-xyz</tspan>&amp;scope=openid%20profile%20email'</text>
  <text x="38" y="108" fill="#a50e0e">because the scheme does not have a registered handler.</text>
  <rect x="520" y="150" width="364" height="92" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="536" y="174" fill="#174ea6" font-family="Helvetica, Arial, sans-serif" font-size="14">Copy the whole red line (or the address</text>
  <text x="536" y="194" fill="#174ea6" font-family="Helvetica, Arial, sans-serif" font-size="14">between the quotes) and paste it in</text>
  <text x="536" y="214" fill="#174ea6" font-family="Helvetica, Arial, sans-serif" font-size="14">“Finish the sign-in”. mymap:// is MyPeugeot;</text>
  <text x="536" y="234" fill="#174ea6" font-family="Helvetica, Arial, sans-serif" font-size="14">the other apps use mymacsdk://, mymdssdk://…</text>
  <path d="M430 118 L520 160" stroke="#1a73e8" stroke-width="2" fill="none"/>
</svg>
